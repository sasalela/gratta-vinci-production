<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gratta & Vinci - Gioco Promozionale</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎰 Gratta & Vinci</h1>
        <p id="subtitle">Inserisci i tuoi dati per giocare e scoprire il premio!</p>

        <div id="setupError" class="message error hidden"></div>

        <div id="setupForm" class="card hidden">
            <h2>Partecipa</h2>
            <p id="campaignInfo" class="campaign-info"></p>
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="nome@esempio.it" required>
            <label class="checkbox-label">
                <input type="checkbox" id="privacyConsent">
                Accetto il trattamento dei dati personali per partecipare al gioco
            </label>
            <div id="formError" class="message error hidden"></div>
            <button id="playBtn" type="button">Gioca</button>
        </div>

        <div id="gameSection" class="card hidden">
            <h2>Gratta e Vinci</h2>
            <canvas id="scratch" width="300" height="150"></canvas>
            <div id="result"></div>
            <button id="resetBtn" type="button">Raschia di nuovo</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
